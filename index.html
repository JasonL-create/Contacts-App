function addPage(){let content=step===1?`<p class="muted small" style="text-align:center;margin-top:35px">Enter phone number</p><div class="keypad-number" id="display">${addPhone?esc(fmt(addPhone)):'(000) 000-0000'}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(k=>`<button class="key" data-key="${k}">${k}</button>`).join('')}</div><div class="keypad-actions"><button class="icon-btn" id="erase" aria-label="Delete last digit">${svg('delete')}</button></div><button class="action full" id="next" ${addPhone.replace(/\D/g,'').length<7?'disabled':''}>Next</button><button class="ghost full" id="paste">Paste number from clipboard</button>`:`<div class="add-step"><h2>What's their name?</h2><p class="muted small">${esc(fmt(addPhone))} <button class="edit" id="change-number">Edit number</button></p><input id="full-name" class="field" placeholder="Full Name" value="${esc(addName)}" autocomplete="name"><div class="section">Tags (optional)</div><div class="selected-tags">${addTags.map(t=>`<span class="chip selected">${esc(t)} ✓</span>`).join('')}</div><div class="tag-picker" id="chosen-tags">${tagPicker(addTags)}</div><div class="field-row"><input class="field" id="new-tag" placeholder="+ Add Tag"><button class="action secondary" id="add-tag">Add</button></div><button class="action full" id="save" ${!addName.trim()?'disabled':''}>Save Contact</button></div>`;shell(`<div class="top"><button class="back" id="cancel">${svg('back')} ${step===1?'Contacts':'Back'}</button><strong>New Contact</strong><span class="small muted">${step} of 2</span></div>${content}`);$('#cancel').onclick=()=>step===2?(step=1,render()):go('contacts');if(step===1){document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(addPhone.length<18)addPhone+=b.dataset.key;$('#display').textContent=fmt(addPhone);$('#next').disabled=addPhone.replace(/\D/g,'').length<7});$('#erase').onclick=()=>{addPhone=addPhone.slice(0,-1);$('#display').textContent=addPhone?fmt(addPhone):'(000) 000-0000';$('#next').disabled=addPhone.replace(/\D/g,'').length<7};$('#next').onclick=()=>{step=2;render();$('#full-name')?.focus()};$('#paste').onclick=async()=>{try{let t=await navigator.clipboard.readText();addPhone=t.replace(/[^\d+]/g,'').slice(0,18);render()}catch{flash('Paste is unavailable in this browser')}}}else{$('#change-number').onclick=()=>{addName=$('#full-name').value;step=1;render()};$('#full-name').oninput=e=>{addName=e.target.value;$('#save').disabled=!addName.trim()};bindTagPicker(addTags,()=>render());$('#add-tag').onclick=()=>{let t=$('#new-tag').value.trim();if(t&&!addTags.some(x=>x.toLowerCase()===t.toLowerCase()))addTags.push(t);render()};$('#new-tag').onkeydown=e=>{if(e.key==='Enter')$('#add-tag').click()};$('#save').onclick=()=>{let c={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:addName.trim(),primary:addPhone,work:'',other:'',email:'',company:'',birthday:'',address:'',website:'',notes:'',tags:[...addTags],favorite:false};let dup=db.contacts.find(x=>norm(x.primary)===norm(c.primary));if(dup&&!confirm('This number is already saved for '+dup.name+'. Add another contact anyway?'))return;db.contacts.push(c);persist();current=null;previous='contacts';search='';filterTag='';go('contacts');flash('Contact saved')}}}
function allTags(){return [...new Set(db.contacts.flatMap(c=>c.tags||[]))].sort((a,b)=>a.localeCompare(b))}function tagPicker(selected){return allTags().map(t=>`<button class="chip ${selected.includes(t)?'selected':''}" data-pick="${esc(t)}">${esc(t)}</button>`).join('')}function bindTagPicker(selected,rerender){document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let t=b.dataset.pick;let i=selected.indexOf(t);if(i<0)selected.push(t);else selected.splice(i,1);rerender()})}
const fields=[['primary','Primary','Phone number'],['work','Work','Phone number'],['other','Other','Phone number'],['email','Email','Email address'],['company','Company','Company name'],['birthday','Birthday','MM/DD or MM/DD/YYYY'],['address','Address','Street address'],['website','Website','Website'],['notes','Notes','Notes']];function detailPage(){let c=db.contacts.find(x=>x.id===current);if(!c){go('contacts');return}let filled=fields.filter(([k])=>String(c[k]||'').trim());let blank=fields.filter(([k])=>!String(c[k]||'').trim());let line=([k,label])=>`<div class="line"><span class="label">${label}</span><div class="value">${edit?`<input class="field" data-field="${k}" value="${esc(k==='birthday'?displayBirthday(c[k]):c[k])}" ${['primary','work','other'].includes(k)?'type="tel" inputmode="tel" autocomplete="tel"':''}>`:k==='primary'||k==='work'||k==='other'?`<a class="value link" href="tel:${esc(norm(c[k]))}">${esc(fmt(c[k]))}</a>`:k==='email'?`<a class="value link" href="mailto:${esc(c[k])}">${esc(c[k])}</a>`:k==='website'?`<a class="value link" href="${esc(/^https?:\/\//i.test(c[k])?c[k]:'https://'+c[k])}" target="_blank" rel="noopener">${esc(c[k])}</a>`:`<span class="${k==='notes'?'note':''}">${esc(k==='birthday'?displayBirthday(c[k]):c[k])}</span>`}</div>${!edit&&['primary','work','other'].includes(k)?`<div class="row-actions"><a class="icon-btn" aria-label="Call" href="tel:${esc(norm(c[k]))}">${svg('phone')}</a><a class="icon-btn" aria-label="Text" href="sms:${esc(norm(c[k]))}">${svg('message')}</a></div>`:''}</div>`;shell(`<div class="top"><button class="back" id="back">${svg('back')} Contacts</button><button class="edit" id="edit">${edit?'Done':'Edit'}</button></div>${edit?`<input class="field" id="edit-name" value="${esc(c.name)}" placeholder="Full Name">`:`<div class="top" style="margin-bottom:4px"><h1 class="detail-title">${esc(c.name)}</h1><button class="icon-btn" id="fav" aria-label="Toggle favorite" title="Favorite" style="color:${c.favorite?'#e8a12c':'#a1a8b1'}">${svg('star')}</button></div>`}<div>${filled.map(line).join('')}</div><div class="tags">${(c.tags||[]).map(t=>`<button class="chip" data-remove-tag="${esc(t)}">${esc(t)}${edit?' ×':''}</button>`).join('')}</div><div class="detail-actions"><button class="ghost" id="tag-toggle">${tagPanel?'− Close Tags':'+ Add Tag'}</button>${tagPanel?`<div class="tag-panel"><div class="tag-picker">${allTags().map(t=>`<button class="chip ${(c.tags||[]).includes(t)?'selected':''}" data-detail-tag="${esc(t)}">${esc(t)} ${(c.tags||[]).includes(t)?'✓':'+'}</button>`).join('')}</div><div class="field-row"><input class="field" id="tag-input" placeholder="New tag name"><button class="action secondary" id="tag-add">Add</button></div></div>`:''}${!edit?`<button class="ghost" id="expand">${expanded?'− Hide fields':'+ Add Information'}</button>`:''}</div>${edit||expanded?`<div class="section">Add information</div><div id="missing">${blank.map(([k,label,hint])=>`<div class="field-row"><span class="label">${label}</span><input class="field" data-new="${k}" placeholder="${hint}" ${['primary','work','other'].includes(k)?'type="tel" inputmode="tel" autocomplete="tel"':''}><button class="icon-btn" data-save="${k}" aria-label="Save ${label}">${svg('check')}</button></div>`).join('')||'<p class="hint">All available fields are filled.</p>'}</div>`:''}${edit?`<button class="ghost" id="delete-contact" style="color:#b34444;margin-top:20px">Delete contact</button>`:''}`);$('#back').onclick=()=>{edit=false;go(previous==='favorites'?'favorites':'contacts')};$('#edit').onclick=()=>{if(edit){document.querySelectorAll('[data-field]').forEach(i=>c[i.dataset.field]=i.dataset.field==='birthday'?normalizeBirthday(i.value):i.value.trim());let n=$('#edit-name').value.trim();if(n)c.name=n;document.querySelectorAll('[data-new]').forEach(i=>{if(i.value.trim())c[i.dataset.new]=i.dataset.new==='birthday'?normalizeBirthday(i.value):i.value.trim()});persist()}edit=!edit;render()};$('#fav')?.addEventListener('click',()=>{c.favorite=!c.favorite;persist();render()});$('#expand')?.addEventListener('click',()=>{expanded=!expanded;render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let i=document.querySelector(`[data-new="${b.dataset.save}"]`);if(i.value.trim()){c[b.dataset.save]=i.value.trim();persist();render();flash('Saved')}});$('#tag-toggle')?.addEventListener('click',()=>{tagPanel=!tagPanel;render()});document.querySelectorAll('[data-detail-tag]').forEach(b=>b.onclick=()=>{let t=b.dataset.detailTag;c.tags=c.tags||[];c.tags=c.tags.includes(t)?c.tags.filter(x=>x!==t):[...c.tags,t];persist();render()});$('#tag-input')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('#tag-add')?.click()});$('#tag-add')?.addEventListener('click',()=>{let t=$('#tag-input').value.trim();c.tags=c.tags||[];if(t&&!c.tags.some(x=>x.toLowerCase()===t.toLowerCase())){c.tags.push(t);persist();render()}});document.querySelectorAll('[data-remove-tag]').forEach(b=>b.onclick=()=>{if(!edit)return;c.tags=c.tags.filter(t=>t!==b.dataset.removeTag);persist();render()});$('#delete-contact')?.addEventListener('click',()=>{if(confirm('Delete '+c.name+'?')){db.contacts=db.contacts.filter(x=>x.id!==c.id);persist();go('contacts')}})}
function tagsPage(){let tags=allTags();shell(`<div class="top"><h1>Tags</h1><span class="muted small">${tags.length} tags</span></div>${tags.map(t=>`<button class="setting" data-tag="${esc(t)}"><span>${esc(t)}</span><span class="muted small">${db.contacts.filter(c=>c.tags.includes(t)).length} ${svg('chevron')}</span></button>`).join('')||'<p class="empty">Tags appear here when added to contacts.</p>'}`);document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{filterTag=b.dataset.tag;search='';go('contacts')})}
function normalizeBirthday(v){v=String(v||'').trim();if(!v)return '';let m=v.match(/^--(\d{2})-?(\d{2})$/);if(m)return m[1]+'/'+m[2];m=v.match(/^(\d{4})-?(\d{2})-?(\d{2})$/);if(m)return (+m[1]<=1604?'':m[1]+'/')+m[2]+'/'+m[3];return v}
function displayBirthday(v){let m=String(v||'').match(/^1604[-/]?(\d{2})[-/]?(\d{2})$/);return m?m[1]+'/'+m[2]:v}
// Apple vCard import/export support. Preserve original cards for lossless re-export.
const vcUnescape=s=>String(s||'').replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1');
const vcEscape=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
function vcLines(card){return card.replace(/\r\n?/g,'\n').split('\n').reduce((a,l)=>{if(/^[ \t]/.test(l)&&a.length)a[a.length-1]+=l.slice(1);else a.push(l);return a},[])}
function vcParse(text){let chunks=text.replace(/\r\n?/g,'\n').match(/BEGIN:VCARD[\s\S]*?END:VCARD/gi)||[];return chunks.map(raw=>{let lines=vcLines(raw),items=[];for(let line of lines){let i=line.indexOf(':');if(i<0)continue;let left=line.slice(0,i),key=left.split(';')[0].split('.').at(-1).toUpperCase(),params=left.slice(left.indexOf(';')+1).toUpperCase();items.push({key,params,value:line.slice(i+1),line})}const all=k=>items.filter(x=>x.key===k),first=k=>vcUnescape(all(k)[0]?.value||'');let structured=all('N')[0]?.value.split(';').map(vcUnescape)||[],full=first('FN')||[structured[1],structured[0]].filter(Boolean).join(' ')||'Unnamed contact';let tels=all('TEL').map(x=>({value:vcUnescape(x.value).replace(/^tel:/i,''),params:x.params})),emails=all('EMAIL').map(x=>vcUnescape(x.value)),websites=all('URL').map(x=>vcUnescape(x.value)),addresses=all('ADR').map(x=>vcUnescape(x.value).split(';').filter(Boolean).join(', '));let preferred=tels.find(x=>/PREF|CELL|MOBILE|IPHONE/i.test(x.params))||tels[0];let work=tels.find(x=>/WORK/i.test(x.params)&&x!==preferred);let other=tels.find(x=>x!==preferred&&x!==work);let extras=items.filter(x=>!['BEGIN','END','VERSION','FN','N','TEL','EMAIL','ORG','BDAY','ADR','URL','NOTE'].includes(x.key)).map(x=>x.line);return {id:crypto.randomUUID?.()||String(Date.now()+Math.random()),name:full,primary:preferred?.value||'',work:work?.value||'',other:other?.value||'',email:emails[0]||'',company:first('ORG').split(';')[0],birthday:normalizeBirthday(first('BDAY')),address:addresses[0]||'',website:websites[0]||'',notes:first('NOTE'),tags:[],favorite:false,vcfRaw:raw.replace(/\n/g,'\r\n'),vcfOriginal:{name:full,primary:preferred?.value||'',work:work?.value||'',other:other?.value||'',email:emails[0]||'',company:first('ORG').split(';')[0],birthday:normalizeBirthday(first('BDAY')),address:addresses[0]||'',website:websites[0]||'',notes:first('NOTE')},vcfExtra:extras,vcfCounts:{phones:tels.length,emails:emails.length,addresses:addresses.length,websites:websites.length,photos:all('PHOTO').length},vcfStructuredName:structured}})}
function vcPhoneKeys(c){return [c.primary,c.work,c.other].filter(Boolean).map(x=>norm(x).replace(/^\+/,''))}
function vcDuplicate(a,b){let ap=vcPhoneKeys(a),bp=vcPhoneKeys(b);if(ap.some(x=>x.length>=7&&bp.includes(x)))return true;let ae=String(a.email||'').trim().toLowerCase(),be=String(b.email||'').trim().toLowerCase();return !!(ae&&be&&ae===be)}
function vcExport(c){let original=c.vcfRaw;if(original){let orig=c.vcfOriginal||{};let same=['name','primary','work','other','email','company','birthday','address','website','notes'].every(k=>String(c[k]||'')===String(orig[k]||''));if(same)return original;let lines=vcLines(original);let changes=[['FN','name'],['TEL','primary'],['EMAIL','email'],['ORG','company'],['BDAY','birthday'],['ADR','address'],['URL','website'],['NOTE','notes']];for(let [prop,key] of changes){if(String(c[key]||'')===String(orig[key]||''))continue;let index=lines.findIndex(l=>new RegExp('^(?:[^.:]+\\.)?'+prop+'(?:;[^:]*)?:','i').test(l));let val=prop==='ADR'?'':vcEscape(c[key]||'');if(prop==='ADR'&&c[key])val=';;'+vcEscape(c[key])+';;;;';if(index>=0){if(c[key])lines[index]=lines[index].slice(0,lines[index].indexOf(':')+1)+val;else lines.splice(index,1)}else if(c[key])lines.splice(lines.findIndex(l=>/^END:VCARD/i.test(l)),0,prop+':'+val)}if(String(c.work||'')!==String(orig.work||'')&&c.work)lines.splice(lines.findIndex(l=>/^END:VCARD/i.test(l)),0,'TEL;TYPE=WORK:'+vcEscape(c.work));if(String(c.other||'')!==String(orig.other||'')&&c.other)lines.splice(lines.findIndex(l=>/^END:VCARD/i.test(l)),0,'TEL;TYPE=OTHER:'+vcEscape(c.other));return lines.join('\r\n')}let n=c.name.trim().split(/\s+/),family=n.length>1?n.pop():'';return ['BEGIN:VCARD','VERSION:3.0','N:'+vcEscape(family)+';'+vcEscape(n.join(' '))+';;;','FN:'+vcEscape(c.name),...[['TEL;TYPE=CELL',c.primary],['TEL;TYPE=WORK',c.work],['TEL;TYPE=OTHER',c.other],['EMAIL',c.email],['ORG',c.company],['BDAY',c.birthday],['URL',c.website],['NOTE',c.notes]].filter(x=>x[1]).map(([k,v])=>k+':'+vcEscape(v)),...(c.address?['ADR:;;'+vcEscape(c.address)+';;;;']:[]),'END:VCARD'].join('\r\n')}
function vcDownload(contents,name,type){let blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function vcImportReview(file){file.text().then(t=>{let incoming=vcParse(t);if(!incoming.length){flash('No valid vCards found');return}let unique=[],dupes=[],within=[];for(let c of incoming){if(db.contacts.some(e=>vcDuplicate(c,e)))dupes.push(c);else if(unique.some(e=>vcDuplicate(c,e)))within.push(c);else unique.push(c)}let withExtras=incoming.filter(c=>Object.values(c.vcfCounts).some(n=>n>1)||c.vcfExtra.length).length;let summary=`${incoming.length} contact${incoming.length===1?'':'s'} found\n\n${unique.length} new contacts\n${dupes.length} already in your app\n${within.length} repeated in the file\n${withExtras} with additional Apple fields preserved\n\nImport ${unique.length} new contacts? Existing contacts will not be changed.`;if(!confirm(summary))return;try{let before=JSON.stringify(db);localStorage.setItem('contacts-pre-vcf-import-backup',before);db.contacts.push(...unique);persist();search='';filterTag='';go('contacts');flash(unique.length+' contacts imported')}catch(err){flash('Storage full — no contacts imported');db=JSON.parse(localStorage.getItem(STORE)||'{}');go('settings')}}).catch(()=>flash('Unable to read file'))}

function settingsPage(){shell(`<div class="top"><h1>Settings</h1></div>${[['mycard','My Card'],['sort','Sort contacts'],['export','Export backup (.json)'],['vcfexport','Export Apple contacts (.vcf)'],['import','Import contacts (.vcf or .json)'],['reset','Delete all app data']].map(([k,t])=>`<button class="setting" data-setting="${k}"><span>${t}</span>${svg('chevron')}</button>`).join('')}<p class="hint">Apple vCard imports preserve original contact records, including extra fields. Existing contacts are never overwritten by a vCard import. This app still stores contacts on this device only; export backups regularly.</p><input id="import-file" type="file" accept=".vcf,.vcard,.json,text/vcard,text/x-vcard,application/json" hidden>`);document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{let k=b.dataset.setting;if(k==='mycard')go('mycard');if(k==='sort')go('sort');if(k==='export')vcDownload(JSON.stringify(db,null,2),'contacts-backup.json','application/json');if(k==='vcfexport')vcDownload(db.contacts.map(vcExport).join('\r\n'),'contacts-export.vcf','text/vcard');if(k==='import')$('#import-file').click();if(k==='reset'&&confirm('Delete ALL contacts and settings stored in this app on this device?')){db={contacts:[],myCard:{name:'',phone:'',email:'',company:''},sort:'first'};persist();go('contacts')}});$('#import-file').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;if(/\.(vcf|vcard)$/i.test(f.name)){vcImportReview(f);return}try{let o=JSON.parse(await f.text());if(!Array.isArray(o.contacts))throw Error();if(confirm('Replace current contacts with '+o.contacts.length+' contacts from this JSON backup?')){db={...db,...o};persist();go('contacts');flash('Contacts restored')}}catch{flash('Invalid backup file')}}}
function sortPage(){shell(`<div class="top"><button class="back" id="back">${svg('back')} Settings</button><strong>Sort contacts</strong></div>${[['first','First name (default)'],['last','Last name']].map(([v,t])=>`<button class="setting" data-sort="${v}">${t} ${db.sort===v?svg('check'):''}</button>`).join('')}`);$('#back').onclick=()=>go('settings');document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{db.sort=b.dataset.sort;persist();render()})}
function myCardPage(){let m=db.myCard;shell(`<div class="top"><button class="back" id="back">${svg('back')} Settings</button><strong>My Card</strong></div><p class="hint">Enter your details here. Shareable QR codes can be added in the next version.</p>${[['name','Full Name'],['phone','Phone'],['email','Email'],['company','Company']].map(([k,t])=>`<div class="field-row"><span class="label">${t}</span><input class="field" data-me="${k}" value="${esc(m[k]||'')}" placeholder="${t}"></div>`).join('')}<button class="action full" id="save-me">Save My Card</button><button class="ghost full" id="scan" disabled>Scan Contact QR (coming later)</button>`);$('#back').onclick=()=>go('settings');$('#save-me').onclick=()=>{document.querySelectorAll('[data-me]').forEach(i=>m[i.dataset.me]=i.value.trim());persist();flash('My Card saved')}}
function render(){if(['contacts','favorites','search'].includes(view))listPage();else if(view==='add')addPage();else if(view==='detail')detailPage();else if(view==='tags')tagsPage();else if(view==='settings')settingsPage();else if(view==='sort')sortPage();else if(view==='mycard')myCardPage()};render();
</script></body></html>
