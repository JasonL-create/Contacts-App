:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18212d;background:#f7f8fa;font-size:15px}*{box-sizing:border-box}html{width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}body{margin:0;width:100%;overflow-x:hidden;touch-action:pan-y}input,textarea,select{touch-action:manipulation}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}.app{max-width:620px;margin:auto;min-height:100dvh;background:white}.main{padding:18px 18px calc(95px + env(safe-area-inset-bottom));min-height:100dvh}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:12px}.top h1{font-size:27px;letter-spacing:-.7px;margin:0;font-weight:730}.muted{color:#87909d}.small{font-size:12px}.search{margin-bottom:16px;width:100%;border:0;background:#f1f3f6;border-radius:11px;padding:12px 14px;outline:none;font-size:16px}.search:focus,.field:focus{outline:2px solid #d0e0ff}.count{font-size:12px;color:#89929e;margin:13px 0 7px}.favorite-star{color:#e4a126;font-size:16px;margin-left:5px;vertical-align:baseline}.favorite-divider{border-top:1px solid #cbd2db;margin:9px 0 5px}.contact-row{display:flex;align-items:center;gap:5px;min-height:41px;border-bottom:1px solid #f0f1f3}.person{flex:1;text-align:left;font-weight:550;font-size:17px;background:none;border:0;padding:10px 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icon-btn{border:0;background:transparent;color:#5d6b7c;min-width:39px;min-height:39px;display:grid;place-items:center;border-radius:10px;padding:0}.icon-btn:active,.nav-item:active{background:#edf2fa}.icon{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,620px);background:rgba(255,255,255,.97);border-top:1px solid #e7eaf0;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(9px + env(safe- ions{display:flex;align-items:center;justify-content:flex-end;max-width:340px;margin:10px auto 20px}.add-step{max-width:420px;margin:auto}.add-step h2{font-size:21px;margin:20px 0 6px}.add-step .field{margin:9px 0}.add-step .action{margin-top:14px}.tag-list{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.setting{width:100%;border:0;background:none;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eff1f4;padding:16px 0;text-align:left}.row-actions{display:flex;gap:4px}.tag-picker{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.hint{font-size:12px;color:#9099a5;margin:12px 0}.space{height:12px}.note{white-space:pre-wrap}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#233247;color:white;padding:10px 15px;border-radius:10px;font-size:13px;z-index:15;max-width:90vw}.filter{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid #e6e9ef;border-radius:999px;background:white;padding:7px 11px;font-size:12px}.pill.on{background:#eaf1ff;border-color:#b6cdf6;color:#225fbd}@media(min-width:620px){.app{border-left:1px solid #eee;border-right:1px solid #eee}}

const icons={search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',star:'<path d="m12 2 3.2 6.6 7.3 1.1-5.3 5.1 1.3 7.2L12 18.6 5.5 22l1.3-7.2-5.3-5.1 7.3-1.1z"/>',plus:'<path d="M12 4v16M4 12h16"/>',tags:'<path d="M3 4h9l9 9-8 8-10-10z"/><circle cx="8" cy="8" r="1"/>',home:'<path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/>',phone:'<path d="M6 3 3 6c0 8 7 15 15 15l3-3-5-4-3 3c-3-1-5-3-6-6l3-3z"/>',message:'<path d="M21 11a8 8 0 0 1-8 8H5l-3 3v-9a9 9 0 1 1 19-2z"/>',chevron:'<path d="m9 5 7 7-7 7"/>',back:'<path d="m15 5-7 7 7 7"/>',trash:'<path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14"/>',check:'<path d="m4 12 5 5L20 6"/>',delete:'<path d="m9 9 6 6m0-6-6 6M9 4H21v16H9L2 12z"/>',mail:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>'};
const svg=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>`;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE='simple-contacts-v1';const load=()=>{try{return JSON.parse(localStorage.getItem(STORE))}catch{return null}};let db=load()||{contacts:[],myCard:{name:'',phone:'',email:'',company:''},sort:'first'};let view='contacts',previous='contacts',current=null,step=1,addPhone='',addName='',addTags=[],filterTag='',search='',edit=false,expanded=false,tagText='',toastTimer;
function persist(){localStorage.setItem(STORE,JSON.stringify(db))}function flash(t){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2100)}
function norm(n){return String(n||'').replace(/[^\d+]/g,'')}function fmt(n){let d=String(n).replace(/\D/g,'');return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:n}function byName(a,b){const v=c=>db.sort==='last'?(c.name.trim().split(/\s+/).at(-1)||''):c.name.trim().split(/\s+/)[0];return v(a).localeCompare(v(b))||a.name.localeCompare(b.name)}function go(v){view=v;edit=false;expanded=false;render()}function nav(){return `<nav class="footer" aria-label="Main navigation">${[['search','Search'],['star','Favorites'],['plus','Add'],['tags','Tags'],['home','Home']].map(([i,t])=>`<button class="nav-item ${i==='plus'?'add':''} ${view===(i==='star'?'favorites':i==='plus'?'add':i==='search'?'search':i)?'active':''}" data-nav="${i}" aria-label="${t}">${svg(i)}<span>${t}</span></button>`).join('')}</nav>`}
function shell(body){$('#app').innerHTML=`<main class="main">${body}</main>${nav()}`;bindCommon()}
function bindCommon(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let n=b.dataset.nav;if(n==='plus'){step=1;addPhone='';addName='';addTags=[];go('add')}else if(n==='search'){go('search');setTimeout(()=>$('#search')?.focus(),30)}else go(n==='star'?'favorites':n==='home'?'contacts':n)})}
function rows(list){const row=c=>`<div class="contact-row"><button class="person" data-open="${c.id}">${esc(c.name)}${c.favorite?'<span class="favorite-star" aria-label="Favorite">★</span>':''}</button><button class="icon-btn" data-call="${c.id}" aria-label="Call ${esc(c.name)}">${svg('phone')}</button><button class="icon-btn" data-text="${c.id}" aria-label="Text ${esc(c.name)}">${svg('message')}</button><button class="icon-btn" data-open="${c.id}" aria-label="Open ${esc(c.name)}">${svg('chevron')}</button></div>`;let favorites=list.filter(c=>c.favorite),others=list.filter(c=>!c.favorite);return favorites.map(row).join('')+(favorites.length&&others.length?'<div class="favorite-divider" role="separator" aria-label="Other contacts"></div>':'')+others.map(row).join('')}
function filteredContacts(){return [...db.contacts].filter(c=>(view!=='favorites'||c.favorite)&&(!filterTag||c.tags?.includes(filterTag))&&(!search||[c.name,c.primary,c.work,c.other,c.email,c.company,c.notes,...(c.tags||[])].join(' ').toLowerCase().includes(search.toLowerCase()))).sort(byName)}
function listPage(){let list=filteredContacts();shell(`<div class="top"><h1>${view==='favorites'?'Favorites':'Contacts'}</h1><button class="settings-top" id="settings-shortcut" aria-label="Settings" title="Settings">${svg('settings')}</button></div><input class="search" id="search" placeholder="Search names, numbers, tags..." value="${esc(search)}" autocomplete="off" aria-label="Search contacts">${filterTag?`<div class="filter"><button class="pill on" id="clear-tag">${esc(filterTag)} ×</button></div>`:''}<div id="results">${rows(list)||'<p class="empty">No contacts found</p>'}</div>`);$('#settings-shortcut').onclick=()=>go('settings');$('#search').oninput=e=>{search=e.target.value;updateRows()};$('#clear-tag')?.addEventListener('click',()=>{filterTag='';render()});bindRows()}
function updateRows(){let list=filteredContacts();$('#results').innerHTML=rows(list)||'<p class="empty">No contacts found</p>';bindRows()}
function bindRows(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{current=b.dataset.open;previous=view;go('detail')});document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>{let c=db.contacts.find(x=>x.id===b.dataset.call);if(c?.primary)location.href='tel:'+norm(c.primary);else flash('No primary phone number')});document.querySelectorAll('[data-text]').forEach(b=>b.onclick=()=>{let c=db.contacts.find(x=>x.id===b.dataset.text);if(c?.primary)location.href='sms:'+norm(c.primary);else flash('No primary phone number')})}
function addPage(){let content=step===1?`<p class="muted small" style="text-align:center;margin-top:35px">Enter phone number</p><div class="keypad-number" id="display">${addPhone?esc(fmt(addPhone)):'(000) 000-0000'}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(k=>`<button class="key" data-key="${k}">${k}</button>`).join('')}</div><div class="keypad-actions"><button class="icon-btn" id="erase" aria-label="Delete last digit">${svg('delete')}</button></div><button class="action full" id="next" ${addPhone.replace(/\D/g,'').length<7?'disabled':''}>Next</button><button class="ghost full" id="paste">Paste number from clipboard</button>`:`<div class="add-step"><h2>What's their name?</h2><p class="muted small">${esc(fmt(addPhone))} <button class="edit" id="change-number">Edit number</button></p><input id="full-name" class="field" placeholder="Full Name" value="${esc(addName)}" autocomplete="name"><div class="section">Tags (optional)</div><div class="selected-tags">${addTags.map(t=>`<span class="chip selected">${esc(t)} ✓</span>`).join('')}</div><div class="tag-picker" id="chosen-tags">${tagPicker(addTags)}</div><div class="field-row"><input class="field" id="new-tag" placeholder="+ Add Tag"><button class="action secondary" id="add-tag">Add</button></div><button class="action full" id="save" ${!addName.trim()?'disabled':''}>Save Contact</button></div>`;shell(`<div class="top"><button class="back" id="cancel">${svg('back')} ${step===1?'Contacts':'Back'}</button><strong>New Contact</strong><span class="small muted">${step} of 2</span></div>${content}`);$('#cancel').onclick=()=>step===2?(step=1,render()):go('contacts');if(step===1){document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(addPhone.length<18)addPhone+=b.dataset.key;$('#display').textContent=fmt(addPhone);$('#next').disabled=addPhone.replace(/\D/g,'').length<7});$('#erase').onclick=()=>{addPhone=addPhone.slice(0,-1);$('#display').textContent=addPhone?fmt(addPhone):'(000) 000-0000';$('#next').disabled=addPhone.replace(/\D/g,'').length<7};$('#next').onclick=()=>{step=2;render();$('#full-name')?.focus()};$('#paste').onclick=async()=>{try{let t=await navigator.clipboard.readText();addPhone=t.replace(/[^\d+]/g,'').slice(0,18);render()}catch{flash('Paste is unavailable in this browser')}}}else{$('#change-number').onclick=()=>{addName=$('#full-name').value;step=1;render()};$('#full-name').oninput=e=>{addName=e.target.value;$('#save').disabled=!addName.trim()};bindTagPicker(addTags,()=>render());$('#add-tag').onclick=()=>{let t=$('#new-tag').value.trim();if(t&&!addTags.some(x=>x.toLowerCase()===t.toLowerCase()))addTags.push(t);render()};$('#new-tag').onkeydown=e=>{if(e.key==='Enter')$('#add-tag').click()};$('#save').onclick=()=>{let c={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:addName.trim(),primary:addPhone,work:'',other:'',email:'',company:'',birthday:'',address:'',website:'',notes:'',tags:[...addTags],favorite:false};let dup=db.contacts.find(x=>norm(x.primary)===norm(c.primary));if(dup&&!confirm('This number is already saved for '+dup.name+'. Add another contact anyway?'))return;db.contacts.push(c);persist();current=null;previous='contacts';search='';filterTag='';go('contacts');flash('Contact saved')}}}
function allTags(){return [...new Set(db.contacts.flatMap(c=>c.tags||[]))].sort((a,b)=>a.localeCompare(b))}function tagPicker(selected){return allTags().map(t=>`<button class="chip ${selected.includes(t)?'selected':''}" data-pick="${esc(t)}">${esc(t)}</button>`).join('')}function bindTagPicker(selected,rerender){document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let t=b.dataset.pick;let i=selected.indexOf(t);if(i<0)selected.push(t);else selected.splice(i,1);rerender()})}
const fields=[['primary','Primary','Phone number'],['work','Work','Phone number'],['other','Other','Phone number'],['email','Email','Email address'],['company','Company','Company name'],['birthday','Birthday','MM/DD/YYYY'],['address','Address','Street address'],['website','Website','Website'],['notes','Notes','Notes']];function detailPage(){let c=db.contacts.find(x=>x.id===current);if(!c){go('contacts');return}let filled=fields.filter(([k])=>String(c[k]||'').trim());let blank=fields.filter(([k])=>!String(c[k]||'').trim());let line=([k,label])=>`<div class="line"><span class="label">${label}</span><div class="value">${edit?`<input class="field" data-field="${k}" value="${esc(c[k])}">`:k==='primary'||k==='work'||k==='other'?`<a class="value link" href="tel:${esc(norm(c[k]))}">${esc(fmt(c[k]))}</a>`:k==='email'?`<a class="value link" href="mailto:${esc(c[k])}">${esc(c[k])}</a>`:k==='website'?`<a class="value link" href="${esc(/^https?:\/\//i.test(c[k])?c[k]:'https://'+c[k])}" target="_blank" rel="noopener">${esc(c[k])}</a>`:`<span class="${k==='notes'?'note':''}">${esc(c[k])}</span>`}</div>${!edit&&['primary','work','other'].includes(k)?`<div class="row-actions"><a class="icon-btn" aria-label="Call" href="tel:${esc(norm(c[k]))}">${svg('phone')}</a><a class="icon-btn" aria-label="Text" href="sms:${esc(norm(c[k]))}">${svg('message')}</a></div>`:''}</div>`;shell(`<div class="top"><button class="back" id="back">${svg('back')} Contacts</button><button class="edit" id="edit">${edit?'Done':'Edit'}</button></div>${edit?`<input class="field" id="edit-name" value="${esc(c.name)}" placeholder="Full Name">`:`<div class="top" style="margin-bottom:4px"><h1 class="detail-title">${esc(c.name)}</h1><button class="icon-btn" id="fav" aria-label="Toggle favorite" title="Favorite" style="color:${c.favorite?'#e8a12c':'#a1a8b1'}">${svg('star')}</button></div>`}<div>${filled.map(line).join('')}</div><div class="tags">${(c.tags||[]).map(t=>`<button class="chip" data-remove-tag="${esc(t)}">${esc(t)}${edit?' ×':''}</button>`).join('')}</div>${edit?`<div class="field-row"><input class="field" id="tag-input" placeholder="+ Add Tag"><button class="action secondary" id="tag-add">Add</button></div>`:''}${!edit?`<button class="ghost" id="expand">${expanded?'− Hide fields':'+ Add Information'}</button>`:''}${edit||expanded?`<div class="section">Add information</div><div id="missing">${blank.map(([k,label,hint])=>`<div class="field-row"><span class="label">${label}</span><input class="field" data-new="${k}" placeholder="${hint}"><button class="icon-btn" data-save="${k}" aria-label="Save ${label}">${svg('check')}</button></div>`).join('')||'<p class="hint">All available fields are filled.</p>'}</div>`:''}${edit?`<button class="ghost" id="delete-contact" style="color:#b34444;margin-top:20px">Delete contact</button>`:''}`);$('#back').onclick=()=>{edit=false;go(previous==='favorites'?'favorites':'contacts')};$('#edit').onclick=()=>{if(edit){document.querySelectorAll('[data-field]').forEach(i=>c[i.dataset.field]=i.value.trim());let n=$('#edit-name').value.trim();if(n)c.name=n;document.querySelectorAll('[data-new]').forEach(i=>{if(i.value.trim())c[i.dataset.new]=i.value.trim()});persist()}edit=!edit;render()};$('#fav')?.addEventListener('click',()=>{c.favorite=!c.favorite;persist();render()});$('#expand')?.addEventListener('click',()=>{expanded=!expanded;render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let i=document.querySelector(`[data-new="${b.dataset.save}"]`);if(i.value.trim()){c[b.dataset.save]=i.value.trim();persist();render();flash('Saved')}});$('#tag-add')?.addEventListener('click',()=>{let t=$('#tag-input').value.trim();if(t&&!c.tags.some(x=>x.toLowerCase()===t.toLowerCase())){c.tags.push(t);persist();render()}});document.querySelectorAll('[data-remove-tag]').forEach(b=>b.onclick=()=>{if(!edit)return;c.tags=c.tags.filter(t=>t!==b.dataset.removeTag);persist();render()});$('#delete-contact')?.addEventListener('click',()=>{if(confirm('Delete '+c.name+'?')){db.contacts=db.contacts.filter(x=>x.id!==c.id);persist();go('contacts')}})}
function tagsPage(){let tags=allTags();shell(`<div class="top"><h1>Tags</h1><span class="muted small">${tags.length} tags</span></div>${tags.map(t=>`<button class="setting" data-tag="${esc(t)}"><span>${esc(t)}</span><span class="muted small">${db.contacts.filter(c=>c.tags.includes(t)).length} ${svg('chevron')}</span></button>`).join('')||'<p class="empty">Tags appear here when added to contacts.</p>'}`);document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{filterTag=b.dataset.tag;search='';go('contacts')})}
function settingsPage(){shell(`<div class="top"><h1>Settings</h1></div>${[['mycard','My Card'],['sort','Sort contacts'],['export','Export contacts'],['import','Import contacts'],['reset','Delete all app data']].map(([k,t])=>`<button class="setting" data-setting="${k}"><span>${t}</span>${svg('chevron')}</button>`).join('')}<p class="hint">Contacts are currently stored only in this browser on this device. They do not sync with Apple Contacts or iCloud. Export a backup before clearing browser data.</p><input id="import-file" type="file" accept="application/json,.json" hidden>`);document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{let k=b.dataset.setting;if(k==='mycard')go('mycard');if(k==='sort')go('sort');if(k==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='contacts-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}if(k==='import')$('#import-file').click();if(k==='reset'&&confirm('Delete ALL contacts and settings stored in this app on this device?')){db={contacts:[],myCard:{name:'',phone:'',email:'',company:''},sort:'first'};persist();go('contacts')}});$('#import-file').onchange=async e=>{try{let o=JSON.parse(await e.target.files[0].text());if(!Array.isArray(o.contacts))throw Error();if(confirm('Replace current contacts with '+o.contacts.length+' imported contacts?')){db={...db,...o};persist();go('contacts');flash('Contacts imported')}}catch{flash('Invalid backup file')}}}
function sortPage(){shell(`<div class="top"><button class="back" id="back">${svg('back')} Settings</button><strong>Sort contacts</strong></div>${[['first','First name (default)'],['last','Last name']].map(([v,t])=>`<button class="setting" data-sort="${v}">${t} ${db.sort===v?svg('check'):''}</button>`).join('')}`);$('#back').onclick=()=>go('settings');document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{db.sort=b.dataset.sort;persist();render()})}
function myCardPage(){let m=db.myCard;shell(`<div class="top"><button class="back" id="back">${svg('back')} Settings</button><strong>My Card</strong></div><p class="hint">Enter your details here. Shareable QR codes can be added in the next version.</p>${[['name','Full Name'],['phone','Phone'],['email','Email'],['company','Company']].map(([k,t])=>`<div class="field-row"><span class="label">${t}</span><input class="field" data-me="${k}" value="${esc(m[k]||'')}" placeholder="${t}"></div>`).join('')}<button class="action full" id="save-me">Save My Card</button><button class="ghost full" id="scan" disabled>Scan Contact QR (coming later)</button>`);$('#back').onclick=()=>go('settings');$('#save-me').onclick=()=>{document.querySelectorAll('[data-me]').forEach(i=>m[i.dataset.me]=i.value.trim());persist();flash('My Card saved')}}
function render(){if(['contacts','favorites','search'].includes(view))listPage();else if(view==='add')addPage();else if(view==='detail')detailPage();else if(view==='tags')tagsPage();else if(view==='settings')settingsPage();else if(view==='sort')sortPage();else if(view==='mycard')myCardPage()};render();
</script></body></html>
